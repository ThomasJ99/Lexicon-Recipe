<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kontaktsida för vår receptsida" />

    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/reset.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Kontakt</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="nav-header">
        <a href="#main" class="skip">Hoppa till huvudinnehållet.</a>
        <a class="h1-size no-text-deco red-text" href="#">Recepta</a>
        <nav>
          <ul class="no-list li-size gap-2">
            <li><a class="link" href="recipes.html">Alla recept</a></li>
            <li><a class="link" href="#">Om oss</a></li>
            <li><a class="link" href="contact.html">Kontakt</a></li>
          </ul>
        </nav>
        <button class="border-r btn-pri box-shadow">Logga in</button>
      </header>
    </div>
    <main>
      <div class="wrapper flow">
        <article class="hero-wrapper">
          <img
            src="/images/contact-banner.jpg"
            alt="En funderande pannkaka som kontemplerar sitt liv"
          />
        </article>

        <!-- Action is the reciever, in our case our site, method means how we transfer the form info, 
        post means we send it somewhere, get means we receive it  -->
        <form
          class="margin-i-3 gap-1 card border-r box-shadow padding-1"
          action="#"
          method="post"
        >
          <div class="grid">
            <!-- The for attribute connects it to its content, allowing screenreaders to process it -->
            <label class="label-header" for="name">Namn</label>
            <!-- The attribute type="text" creates a normal text type input field -->
            <input
              type="text"
              name="username"
              id="name"
              required
              autocomplete="name"
              placeholder="Jane Doe"
            />
            <!-- Autocomplete attribute is required for accessibility -->
          </div>

          <div class="grid">
            <!-- Label describes something, similar to a header -->
            <label class="label-header" for="email">Email</label>
            <!-- Input creates a certain type of input field depending on its type attribute -->
            <input
              type="email"
              name="email"
              id="email"
              required
              autocomplete="email"
              placeholder="Jane@Doe.com"
            />
          </div>

          <div class="grid">
            <label class="label-header" for="panncakes"
              >Vad åt du för pannkakor?</label
            >
            <!-- Select is a dropdown containing "options" -->
            <select
              class="border-r"
              name="panncakes"
              id="panncakes"
              multiple
              size="7"
            >
              <option value="" disabled selected>Välj..</option>
              <option value="classic">Klassiska pannkakor</option>
              <option value="green">Gröna pannkakor</option>
              <option value="blue">Blåa pannkakor</option>
              <option value="yellow">Gula taco pannkakor</option>
              <option value="purple">Lila pannkakor</option>
              <option value="pink">Rosa pannkakor</option>
            </select>
          </div>

          <div class="grid">
            <label class="label-header" for="msg">Meddelande</label>
            <!-- Rows determines the size of the textarea window before it start expanding -->
            <textarea
              class="border-r"
              name="message"
              id="msg"
              rows="10"
              placeholder="Text..."
            ></textarea>
          </div>

          <div class="grid">
            <fieldset>
              <!-- Legend is a semantic descriptor alongside fieldset which groups content -->
              <legend>Är det första gången ni besöker oss?</legend>
              <input
                type="radio"
                id="visit-yes"
                name="visit_frequency"
                value="yes"
              />
              <label for="visit-yes">Ja, första gången</label>

              <input
                type="radio"
                id="visit-no"
                name="visit_frequency"
                value="no"
              />
              <label for="visit-no">Nej, besökt förut</label>

              <input
                type="radio"
                id="visit-unknown"
                name="visit_frequency"
                value="unsure"
              />
              <label for="visit-unknown">Vet ej</label>
            </fieldset>
          </div>

          <div class="grid">
            <fieldset>
              <legend>Om ni ätit hos oss förut, hur många besök?</legend>
              <input
                type="radio"
                id="visit-once"
                name="visit_amount"
                value="few"
              />
              <label for="visit-once">1-2 besök</label>

              <input
                type="radio"
                id="visit-twice"
                name="visit_amount"
                value="several"
              />
              <label for="visit-twice">3-5 besök</label>

              <input
                type="radio"
                id="visit-regularly"
                name="visit_amount"
                value="a lot"
              />
              <label for="visit-regularly">Jag är stammis</label>

              <input
                type="radio"
                id="visit-unknown"
                name="visit_amount"
                value="unsure"
              />
              <label for="visit-unknown">Vet ej</label>
            </fieldset>
          </div>

          <div class="grid">
            <label for="privacy">
              Jag samtycker till att mina personuppgifter behandlas i enlighet
              med
              <a href="#">integritetspolicyn</a>
              <input type="checkbox" id="privacy" required />
            </label>
          </div>

          <button class="border-r btn-sec box-shadow" type="submit">
            Skicka formulär
          </button>
        </form>
        <div class="margin-1"></div>
      </div>
    </main>
  </body>
</html>
