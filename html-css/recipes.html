<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/reset.css" />

    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="nav-header">
        <a class="h2-size no-text-deco red-text" href="#">Recepta</a>
        <nav>
          <ul>
            <li><a class="link" href="#">Alla recept</a></li>
            <li><a class="link" href="#">Om oss</a></li>
            <li><a class="link" href="#">Kontakt</a></li>
          </ul>
        </nav>
        <button>Logga in</button>
      </header>
    </div>

    <main>
      <div class="wrapper">
        <article aria-label="hero-card">
          <div class="hero-bg overlay flex">
            <h1 class="white-text h1-size">
              Pannkakor, <span class="">pannkakor, pannkakor</span>
              <span class="h2-size">- i alla dess former och variationer</span>
            </h1>
          </div>
        </article>
        <h2 class="h2-size red-text align-text">
          Hitta dina nya favoritrecept
        </h2>
        <div class="cards">
          <a
            href="#"
            class="no-text-deco"
            alt="Recept till traditionella tunna pannkakor"
          >
            <article class="card">
              <img class="margin-1" src="../images/image-1.jpg" />
              <h2 class="black-text">Klassiska pannkakor</h2>
              <p class="black-text">
                Gör traditionellatunna pannkakor med detta enkla och goda
                pannkaksrecept.
              </p>
            </article>
          </a>
          <article class="card"></article>
        </div>
      </div>
